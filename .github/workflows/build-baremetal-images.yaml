name: Build bare-metal images

# Installs each declaration under images/ from the distro's own installer
# media, unattended, in QEMU/KVM, and verifies the result offline before
# it is allowed anywhere near a machine. See pipelines/distro-iso/README.md
# for what the eight checks are and why each one exists.
#
# Manual only. There is no upstream signal to follow: an installer ISO
# changes on the distro's release schedule, not daily, and a build costs
# 15-50 minutes of a KVM-capable runner.
#
# Glance is the only destination. A GitHub release cannot hold these: the
# asset cap is 2 GB and a bare-metal disk is 12 GB. The manifest and
# checksum are kept as workflow artifacts so a run leaves a record of what
# it produced.
#
# Runner requirements: /dev/kvm, roughly 30 GB free disk (the ISO plus a
# sparse 12 GB disk of which about 4 GB fills), and the console password
# in the BAREMETAL_ADMIN_PASSWORD secret.

on:
  workflow_dispatch:
    inputs:
      push_to_glance:
        description: 'Push to Glance (needs OS_* secrets + reachable endpoint)'
        type: boolean
        default: false
      images:
        description: 'Space-separated image names to build (empty = all)'
        type: string
        default: ''
      k8s_versions:
        description: 'Kubernetes versions to layer on each image, space separated (empty = base images only)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: build-baremetal-images
  cancel-in-progress: false

jobs:
  discover:
    runs-on: self-hosted
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Images from the declarations
        id: gen
        shell: bash
        env:
          WANTED: ${{ inputs.images }}
          K8S_VERSIONS: ${{ inputs.k8s_versions }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-yaml jq
          matrix=$(python3 - <<'PY'
          import glob, json, os, sys, yaml

          with open("upstream/sources.yaml") as fh:
              artifacts = (yaml.safe_load(fh) or {}).get("artifacts") or {}

          wanted = os.environ.get("WANTED", "").split()
          # A layered image is one more matrix row per (image, version):
          # the base is installed in that row too (a job has no disk from
          # another job to start from), so asking for versions costs one
          # install per version. The lock must already exist: the build
          # never resolves anything on the day it runs.
          versions = os.environ.get("K8S_VERSIONS", "").split()
          for v in versions:
              if not os.path.isdir(f"layers/kubernetes/lock/{v}"):
                  sys.exit(f"no lock for Kubernetes {v}: run layers/kubernetes/resolve.sh and resolve-packages.sh, commit lock/")
          rows = []
          for path in sorted(glob.glob("images/*/image.yaml")):
              name = path.split("/")[1]
              if wanted and name not in wanted:
                  continue
              with open(path) as fh:
                  decl = yaml.safe_load(fh) or {}
              if decl.get("enabled") is False and not wanted:
                  continue
              iso = ((decl.get("source") or {}).get("iso"))
              if not iso:
                  sys.exit(f"{path}: source.iso is required")
              size = int((artifacts.get(iso) or {}).get("size_bytes") or 0)
              # GitHub gives a repository 10 GB of cache in total. The
              # Rocky DVD alone is 9.6 GB, so caching it would evict
              # everything else on every run and still be a coin toss;
              # it downloads at 25 MB/s anyway. Cache the small ones only.
              base = {"image": name, "iso": iso,
                      "cache": size and size < 5_000_000_000}
              rows.append(dict(base, k8s="", name=name))
              for v in versions:
                  if not os.path.isfile(f"layers/kubernetes/lock/{v}/packages-{name}.yaml"):
                      sys.exit(f"no package lock for {name} at Kubernetes {v}: run layers/kubernetes/resolve-packages.sh {v} {name}")
                  rows.append(dict(base, k8s=v, name=f"{name}-v{v}"))
          if not rows:
              sys.exit("no images selected")
          print(json.dumps(rows))
          PY
          )
          {
            echo "## Images"
            jq -r '.[] | "- \(.name) (iso: \(.iso), cache: \(.cache)\(if .k8s != "" then ", layer: kubernetes " + .k8s else "" end))"' <<<"$matrix"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    runs-on: self-hosted
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          # dracut-core is here for lsinitrd, which the verify stage uses
          # to read the built image's initramfs. It does not become this
          # runner's initramfs generator.
          # qemu-utils is qemu-img, which the pipeline uses to make the
          # disk and to convert it. It is a separate package from
          # qemu-system-x86 and is not on a clean runner - the first CI
          # run died on "missing required command: qemu-img" after
          # downloading a 9.6 GB ISO, because this list was written on a
          # workstation that already had it.
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils ovmf xorriso socat jq openssl \
            python3 python3-yaml dracut-core initramfs-tools-core curl
          test -e /dev/kvm || {
            echo "::error::/dev/kvm is missing: this runner cannot run an installer" >&2
            exit 1
          }
          lscpu | grep -E 'Model name|^CPU\(s\)|Hypervisor|Virtualization'
          free -m | sed -n 1,2p
          df -h "$PWD" | tail -1
          qemu-system-x86_64 --version | head -1
          # Fail here, not after the ISO download: check every command the
          # pipeline needs before anything expensive happens.
          for c in qemu-system-x86_64 qemu-img xorrisofs socat jq openssl python3 blkid losetup; do
            command -v "$c" >/dev/null || { echo "::error::missing $c on this runner" >&2; exit 1; }
          done
          command -v lsinitrd >/dev/null || command -v unmkinitramfs >/dev/null || {
            echo "::error::no lsinitrd/unmkinitramfs to inspect the built initramfs with" >&2
            exit 1
          }

      - name: Cache the installer ISO
        if: ${{ matrix.cache }}
        uses: actions/cache@v4
        with:
          path: upstream/cache/${{ matrix.iso }}.iso
          key: iso-${{ matrix.iso }}-${{ hashFiles('upstream/sources.yaml') }}

      - name: Fetch the installer ISO
        run: bash ci/fetch-upstream.sh '${{ matrix.iso }}'

      # The layer's artifacts, images and packages: 2.5 GB, keyed on the
      # lock files, so a lock that has not moved is a cache hit. Fetching
      # needs root for the redhat family (the RPMs are copied out of the
      # installer ISO, which is loop-mounted).
      - name: Cache the Kubernetes layer
        if: ${{ matrix.k8s != '' }}
        uses: actions/cache@v4
        with:
          path: upstream/cache/layers/kubernetes/${{ matrix.k8s }}
          key: layer-kubernetes-${{ matrix.k8s }}-${{ hashFiles(format('layers/kubernetes/lock/{0}/*.yaml', matrix.k8s)) }}

      - name: Fetch the Kubernetes layer
        if: ${{ matrix.k8s != '' }}
        run: |
          sudo bash ci/fetch-layer.sh kubernetes '${{ matrix.k8s }}' '${{ matrix.image }}'
          sudo chown -R "$(id -u):$(id -g)" upstream/cache/layers

      - name: Build
        env:
          BAREMETAL_ADMIN_PASSWORD: ${{ secrets.BAREMETAL_ADMIN_PASSWORD }}
        run: |
          [[ -n "$BAREMETAL_ADMIN_PASSWORD" ]] || {
            echo "::error::BAREMETAL_ADMIN_PASSWORD secret is not set" >&2
            exit 1
          }
          layer=()
          [[ -n '${{ matrix.k8s }}' ]] && layer=(--layer 'kubernetes=${{ matrix.k8s }}')
          sudo env \
            BAREMETAL_ADMIN_PASSWORD="$BAREMETAL_ADMIN_PASSWORD" \
            OUTPUT_DIR="$PWD/dist" \
            ./build.sh '${{ matrix.image }}' "${layer[@]}"

      - name: Validate artifacts
        run: |
          set -eux
          sudo chown -R "$(id -u):$(id -g)" dist
          # The manifest is the contract the uploader reads; a build that
          # got this far has already passed the eight console checks, so
          # this is about the record being complete, not a second opinion.
          jq -e '.target == "baremetal" and .baremetal_firmware == true
                 and (.serial_console | length > 0)
                 and (.admin_user | length > 0)' \
            "dist/${{ matrix.name }}.manifest.json"
          if [[ -n '${{ matrix.k8s }}' ]]; then
            # The layer's verify read these back from the image.
            jq -e '.k8s_version == "${{ matrix.k8s }}" and .images_preloaded == true
                   and (.kata_handlers | length > 0)' \
              "dist/${{ matrix.name }}.manifest.json"
          fi
          jq . "dist/${{ matrix.name }}.manifest.json"
          cat "dist/${{ matrix.name }}.sha256"

      # A RaaS runner has no datacenter DNS and the gateway routes by Host
      # header, so the names have to stay in the URL and be seeded locally.
      - name: Point the OpenStack public names at the gateway
        if: ${{ inputs.push_to_glance && vars.OS_GATEWAY_VIP != '' }}
        run: |
          services="keystone glance nova neutron cinder placement"
          for ip in ${{ vars.OS_GATEWAY_VIP }}; do
              names=""
              for svc in $services; do
                  names="$names ${svc}.openstack.svc.cluster.local ${svc}.openstack ${svc}"
              done
              echo "${ip}${names}" | sudo tee -a /etc/hosts
          done
          getent hosts keystone.openstack.svc.cluster.local

      - name: Push this image to Glance
        if: ${{ inputs.push_to_glance }}
        env:
          OS_CLOUD: ${{ secrets.OS_CLOUD }}
          OS_AUTH_URL: ${{ secrets.OS_AUTH_URL }}
          OS_PROJECT_NAME: ${{ secrets.OS_PROJECT_NAME }}
          OS_PROJECT_DOMAIN_NAME: ${{ secrets.OS_PROJECT_DOMAIN_NAME }}
          OS_USERNAME: ${{ secrets.OS_USERNAME }}
          OS_USER_DOMAIN_NAME: ${{ secrets.OS_USER_DOMAIN_NAME }}
          OS_PASSWORD: ${{ secrets.OS_PASSWORD }}
          OS_REGION_NAME: ${{ secrets.OS_REGION_NAME }}
          OS_IDENTITY_API_VERSION: '3'
          OS_INTERFACE: ${{ vars.OS_INTERFACE || 'public' }}
          # rbd. Ironic fetches these itself, and it resolves glance://
          # references natively, so there is no reason to publish the image
          # a second time outside Glance. The S3 store exists as a fallback
          # for a baremetal-operator that has not been taught the scheme -
          # see lib/s3.sh - but it costs a second copy of every image and an
          # anonymously readable object, so it is not the default.
          IMAGE_STORE: ${{ vars.GLANCE_IMAGE_STORE || 'rbd' }}
          # public is safe for an rbd image: its direct_url is an rbd:// URI
          # with no credentials in it. It is also what lets Ironic read the
          # image at all, since is_image_available only passes a private one
          # when the conductor's own project owns it.
          VISIBILITY: ${{ vars.GLANCE_VISIBILITY || 'public' }}
          IMAGE_IMPORT_TIMEOUT: '1800'
          # Only used when GLANCE_IMAGE_STORE is set to s3. Without them the
          # object lands in the bucket but stays credential-only; the push
          # warns and carries on. See lib/s3.sh.
          S3_ENDPOINT: ${{ vars.GLANCE_S3_ENDPOINT }}
          S3_BUCKET: ${{ vars.GLANCE_S3_BUCKET }}
          S3_ACCESS_KEY: ${{ secrets.GLANCE_S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.GLANCE_S3_SECRET_KEY }}
        run: |
          if ! command -v openstack >/dev/null; then
            python3 -m venv "$RUNNER_TEMP/osc"
            "$RUNNER_TEMP/osc/bin/pip" -q install python-openstackclient
            export PATH="$RUNNER_TEMP/osc/bin:$PATH"
          fi
          bash pipelines/distro-iso/push-to-glance.sh dist '${{ matrix.name }}'

      - name: Upload metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: meta-${{ matrix.name }}
          path: |
            dist/${{ matrix.name }}.manifest.json
            dist/${{ matrix.name }}.sha256
          retention-days: 30
          if-no-files-found: error

      # The serial log is the whole diagnostic: the installer writes its
      # transcript there, so a failed run is readable instead of being a
      # screenshot to squint at. Screenshots come along for the cases
      # where the machine never got as far as talking.
      - name: Upload the install transcript on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: install-${{ matrix.image }}
          path: dist/${{ matrix.image }}.install/
          retention-days: 7
          if-no-files-found: ignore
