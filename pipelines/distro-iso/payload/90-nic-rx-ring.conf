# nic-rx-ring in the initramfs as well. networkd configures a link only
# after udev is done with it, RUN programs included, so the rule must be
# present wherever a NIC first appears. The images keep the network stack -
# and with it the NIC drivers - out of the initramfs, so NICs appear in the
# root filesystem; this covers the day a driver lands in the initramfs again
# and its link comes up there: with the rule only in the root filesystem,
# each bnx2x port then reloaded mid-boot (server01, 2026-10-04).
install_items+=" /usr/local/sbin/nic-rx-ring /etc/udev/rules.d/70-nic-rx-ring.rules /usr/sbin/ethtool /usr/bin/logger /usr/bin/awk /usr/bin/basename /usr/bin/readlink /usr/bin/cat "
