# nic-rx-ring in the initramfs as well. networkd configures a link only
# after udev is done with it, RUN programs included, so a rule present when
# the NIC first appears raises the ring before the link is ever up. Present
# only in the root filesystem, it ran after the initramfs had brought the
# links up and each bnx2x port reloaded mid-boot (server01, 2026-10-04).
install_items+=" /usr/local/sbin/nic-rx-ring /etc/udev/rules.d/70-nic-rx-ring.rules /usr/sbin/ethtool /usr/bin/logger /usr/bin/awk /usr/bin/basename /usr/bin/readlink /usr/bin/cat "
