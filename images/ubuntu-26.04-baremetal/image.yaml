# Ubuntu 26.04 LTS for bare metal, installed from the official server ISO.
#
# Not derived from a cloud image, and deliberately so. A cloud image is
# built on the assumption that nobody can walk up to the machine: the
# upstream Ubuntu 26.04 cloud disk has no password on any account
# (/etc/shadow is all "!"), no serial console, GRUB_TIMEOUT=0 with a
# hidden menu, "quiet splash", no HBA drivers in its initramfs and no
# /lib/firmware to speak of. On a VM that is fine - the recovery path is
# to rebuild the instance. On a machine in a rack the recovery path is a
# monitor and a keyboard, and every one of those defaults takes it away.
#
# So the base is the installer the vendor ships for physical machines.
# The installer's package set is the vendor's own answer to "unknown
# hardware": a full kernel, linux-firmware, and an account you can
# actually log in with. Everything the installer does NOT decide - serial
# console, grub menu, generic initramfs - is set below and asserted by
# the pipeline before the image is allowed out.

pipeline: distro-iso

source:
  iso: ubuntu-2604-live-server

installer: subiquity
disk_size: 12G
output_format: raw            # Ironic writes it unconverted
admin_user: sysadmin

# DL360 Gen10 / iLO here: the iLO virtual serial port (serial-over-LAN,
# `ssh Administrator@<iLO>` -> `vsp`) is COM1 = ttyS0. BIOS
# VirtualSerialPort = Com1Irq4 on Server07 and Server09, COM2 being the
# rear DB9 port (EmbeddedSerialPort = Com2Irq3). Measured 2026-09-24 on
# Server07 (kvm-worker5): a line written to /dev/ttyS0 appears on the VSP,
# one written to /dev/ttyS1 does not - and with the console and getty on
# ttyS1, as this declaration first had, the VSP showed nothing. Another
# vendor or BIOS setting needs its own declaration; the answer file also
# puts a getty on the other COM port, so a login works on either.
serial_console: ttyS0

glance:
  properties:
    hw_firmware_type: uefi
    os_distro: ubuntu
    os_version: "26.04"
    # No hypervisor_type on purpose: this record is for Ironic. A Nova
    # baremetal flavor would use this same image; a Nova VM must not.
