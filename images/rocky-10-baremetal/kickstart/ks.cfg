# Anaconda kickstart for the Rocky bare-metal image. Read by the installer
# from a second CD-ROM labelled OEMDRV; the pipeline renders the
# placeholders (written between doubled at-signs) before building that CD.
#
# Anything that decides whether a person standing in front of the machine
# can use it is here or in %post, and is checked again offline by the
# pipeline's verify stage.

text
eula --agreed
lang en_US.UTF-8
keyboard --vckeymap=us --xlayouts='us'
timezone Asia/Tokyo --utc

# The DVD is the only repository: the installer VM has no route out, so a
# build cannot quietly depend on the day it ran.
cdrom

# The installer needs an interface only to be told there is nothing on it.
# The deployed machine gets its addresses from the config drive.
network --bootproto=dhcp --device=link --activate --onboot=off --hostname=baremetal

firewall --enabled --service=ssh
selinux --enforcing
services --enabled=sshd,cloud-init,cloud-init-local,cloud-config,cloud-final

# The local login: the account that works when cloud-init did not run and
# somebody is standing at the machine with a keyboard. root stays locked;
# this user has sudo through wheel.
rootpw --lock
user --name=@@ADMIN_USER@@ --groups=wheel --password=@@ADMIN_PASSWORD_HASH@@ --iscrypted

# Whole disk, no LVM: Ironic writes this image to a real disk byte for
# byte and cloud-init grows the last partition on first boot. LVM would
# put another layer between those two facts.
ignoredisk --only-use=vda
clearpart --all --initlabel --disklabel=gpt
part /boot/efi --fstype=efi --size=600 --fsoptions="umask=0077,shortname=winnt"
part /boot     --fstype=xfs --size=1024
part /         --fstype=xfs --grow

# Both consoles on the kernel command line. %post takes "rhgb quiet" back
# out - anaconda puts them in, and a machine whose boot messages are
# hidden is a machine nobody can diagnose at the console.
bootloader --location=mbr --timeout=5 --append="console=tty0 console=@@SERIAL_CONSOLE@@,115200n8"

%packages
@^minimal-environment
kernel
linux-firmware
cloud-init
# cloud-init's growpart module only *calls* growpart; the tool itself is a
# separate package on RPM distros. Without it the deployed machine keeps
# the image's 10 GB root on a 371 GB disk, and cloud-init only logs a
# warning. Verified missing on the first Rocky deploy (2026-09-08).
cloud-utils-growpart
nvme-cli
ethtool
pciutils
usbutils
dmidecode
kbd
-plymouth
# Anaconda adds a platform-<hypervisor> group on its own when it detects
# the hypervisor it is running in - here the build VM - so the first Rocky
# image shipped qemu-guest-agent (@platform-kvm, 2026-09-09) on machines
# that will never see a virtio channel. The exclusions keep whichever
# platform group anaconda picks from bringing an agent along. Asserted
# offline by the verify stage.
-qemu-guest-agent
-open-vm-tools
-hyperv-daemons
%end

%post --log=/root/ks-post.log
set -x

# 1) The console contract. The serial console is the only way into a
#    machine whose network did not come up.
#    Anaconda copies the *installer's* boot arguments into
#    GRUB_CMDLINE_LINUX - including the console=ttyS0 the pipeline uses
#    to capture the install log. The kernel sends /dev/console to the
#    last console= it sees, so that leak silently moved the console off
#    the BMC's port. Strip every console= that is not ours.
sed -i -E -e 's/\brhgb\b//g' -e 's/\bquiet\b//g' \
    -e 's/console=ttyS[0-9]+(,[0-9a-z]+)?//g' -e 's/console=tty0//g' /etc/default/grub
sed -i -E 's/^GRUB_CMDLINE_LINUX="(.*)"$/GRUB_CMDLINE_LINUX="\1 console=tty0 console=@@SERIAL_CONSOLE@@,115200n8"/' /etc/default/grub
sed -i -E 's/  +/ /g; s/=" /="/' /etc/default/grub
cat >> /etc/default/grub <<'EOF'

# Bare metal: the console has to work before anything else does.
GRUB_TIMEOUT=5
GRUB_TIMEOUT_STYLE=menu
GRUB_TERMINAL="console serial"
GRUB_SERIAL_COMMAND="serial --unit=@@SERIAL_UNIT@@ --speed=115200 --word=8 --parity=no --stop=1"
EOF
systemctl enable serial-getty@@@SERIAL_CONSOLE@@.service

# 2) A generic initramfs. Anaconda builds it hostonly, so it carries the
#    drivers of the machine it was installed on - here, a QEMU guest with
#    virtio. On real hardware that initrd cannot find the root filesystem.
#    The drm and hid modules are what make the emergency shell it drops
#    into readable and typeable.
cat > /etc/dracut.conf.d/99-baremetal.conf <<'EOF'
hostonly="no"
add_drivers+=" hid_generic usbhid mgag200 ast i2c_algo_bit "
EOF
dracut --force --regenerate-all

# grub2-mkconfig last: it reads /etc/default/grub, and on this release the
# kernel command line also lives in the BLS entries under /boot/loader.
grub2-mkconfig -o /boot/grub2/grub.cfg
for e in /boot/loader/entries/*.conf; do
    [ -e "$e" ] || continue
    sed -i -E -e 's/\brhgb\b//g' -e 's/\bquiet\b//g' \
        -e 's/console=ttyS[0-9]+(,[0-9a-z]+)?//g' -e 's/console=tty0//g' "$e"
    sed -i -E "/^options / s|\$| console=tty0 console=@@SERIAL_CONSOLE@@,115200n8|; s/  +/ /g" "$e"
done

# 3) Metadata comes from the config drive Ironic and Nova attach. Nothing
#    here should go looking for 169.254.169.254 and time out at boot.
cat > /etc/cloud/cloud.cfg.d/99-datasources.cfg <<'EOF'
datasource_list: [ConfigDrive, NoCloud, None]
EOF

# 4) A template, not a machine.
rm -f /etc/ssh/ssh_host_*
cloud-init clean --logs --seed || true
: > /etc/machine-id
rm -f /var/lib/dbus/machine-id
%end

# The installer powering the machine off is the pipeline's signal that it
# is done.
poweroff
