# Rocky Linux 10 for bare metal, installed from the official DVD.
#
# Same reasoning as the Ubuntu declaration and the repository README: the
# installer's package set is the vendor's own answer to hardware nobody
# has tested, and the console settings a physical machine needs are set
# here and asserted before the image is allowed out.
#
# The DVD, not the minimal ISO: the minimal one carries no AppStream and
# cannot install offline, and this build has no network on purpose.
#
# Rocky's cloud image, unlike Ubuntu's, does ship the full kernel and
# linux-firmware - but it is still a cloud image: no console password, no
# serial console, and an initramfs built hostonly=yes on the builder's
# hardware. That is why this one comes from the installer too.

pipeline: distro-iso

source:
  iso: rocky-10-dvd

installer: kickstart
disk_size: 12G
output_format: raw
admin_user: sysadmin

# DL360 Gen10 / iLO here: the iLO virtual serial port (serial-over-LAN,
# `ssh Administrator@<iLO>` -> `vsp`) is COM1 = ttyS0. BIOS
# VirtualSerialPort = Com1Irq4 on Server07 and Server09, COM2 being the
# rear DB9 port (EmbeddedSerialPort = Com2Irq3). Measured 2026-09-24 on
# Server07 (kvm-worker5): a line written to /dev/ttyS0 appears on the VSP,
# one written to /dev/ttyS1 does not - and with the console and getty on
# ttyS1, as this declaration first had, the VSP showed nothing. Another
# vendor or BIOS setting needs its own declaration; the answer file also
# puts a getty on the other COM port, so a login works on either.
serial_console: ttyS0

glance:
  properties:
    hw_firmware_type: uefi
    # Spelled as the magnum-cluster-api driver's `provides` entry, because
    # Magnum picks the driver by string equality on this value; Ironic does
    # not read it. `rocky` here meant no Magnum template could ever be
    # created from the image.
    os_distro: rockylinux
    os_version: "10"
    # No hypervisor_type: this record is for Ironic.
